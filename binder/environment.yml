# Spyglass environment for the curvenote BinderHub.
#
# Derived from the REES of the 2i2c Spyglass hub image:
#   https://github.com/LorenFrankLab/hhmi-spyglass-image (environment.yml @ 52fb54f)
# Changes from that file are marked "hub:" below. Direct dependencies are
# pinned to the versions resolved on 2026-11-05 (repo2docker 2026.4.0); see
# binder/resolved-packages.txt for the full resolved set.
name: spyglass
channels:
  - conda-forge
  - franklab
  - edeno
  # hub: dropped `defaults` (Anaconda ToS, mixed with conda-forge) and
  # `pytorch` (only used by the commented-out DeepLabCut extras).
dependencies:
  # hub: dropped jupyterlab<4, jupyter_contrib_nbextensions, jupyterlab-git and
  # nbgitpuller; repo2docker provides JupyterLab 4 / Notebook 7 and the
  # notebooks ship in this repo, so nbgitpuller is not needed.
  # Spyglass dependencies
  - bottleneck=1.5.0
  - ipympl=0.9.7
  - matplotlib=3.9.4
  - non_local_detector=0.6.9  # brings jax/jaxlib 0.4.28 (CPU)
  - numpy=1.23.5  # upstream: <1.24
  - pip=25.2
  - position_tools=0.2.2
  - pybind11=3.1.0  # req by mountainsort4 -> isosplit5
  - pydotplus=2.0.2
  - pyfftw=0.12.0  # ghostipy req
  - python=3.9.23
  # hub: dropped pytorch<1.12.0; nothing in spyglass 0.5.1 imports torch
  # (it was for DeepLabCut) and it adds ~1 GB to the image.
  - ripple_detection=1.5.1
  - seaborn=0.13.2
  - track_linearization=2.3.1
  - pip:
      - "black[jupyter]==25.11.0"
      - datajoint==0.14.10
      - ghostipy==0.2.2 # for common_filter
      - jupyterlab_myst==2.7.0
      - ndx-franklab-novela==0.2.3
      # hub: added. spyglass.spikesorting.v1 and spyglass.decoding.v1 import
      # kachery_cloud, but spyglass 0.5.1 only lists it under [test] extras and
      # sortingview>=0.14 no longer pulls it in. spyglass asks for >=0.4.0.
      - kachery-cloud==0.4.2
      - mountainsort4==1.0.7
      - panel==1.3.4 # See panel #6325
      - pubnub==6.3.3
      - pynwb==2.8.3
      - sortingview==0.14.2
      - spikeinterface==0.99.1
      - spyglass-neuro==0.5.1
